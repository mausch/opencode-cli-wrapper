services:
  opencode-api:
    build:
      context: .
      args:
        OPENCODE_VERSION: "1.18.31"
    image: opencode-openai-api:local
    container_name: opencode-api
    user: root
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      HOME: "/home/node"
      OPENCODE_BIN: "opencode"
      OPENCODE_PROXY_URL: "${OPENCODE_PROXY_URL:-}"
      NODE_EXTRA_CA_CERTS: "${NODE_EXTRA_CA_CERTS:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - opencode-data:/home/node/.local/share/opencode
      - opencode-state:/home/node/.local/state
      - ${HOME}/.config/opencode:/home/node/.config/opencode:ro
      - ${HOME}/.cache/opencode:/home/node/.cache/opencode:ro
      - ${HOME}/.local/share/opencode/auth.json:/home/node/.local/share/opencode/auth.json:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/v1/models').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  opencode-data:
  opencode-state:
